##############################################################################
# E2EE Messaging Platform — Docker Compose Stack
# KPU INFO 4190 — Group 7
#
# ARM64-native images for Apple Silicon (M1/M2/M3) development.
# Same configuration deploys unchanged to linux/arm64 Ubuntu VPS.
#
# Services:
#   synapse  — Matrix homeserver (Synapse)
#   postgres — PostgreSQL 15 database backend
#   nginx    — Reverse proxy: TLS termination + Admin API blocking
#   element  — Element Web SPA (React + libolm E2EE)
##############################################################################

version: "3.8"

services:

  # ── SYNAPSE HOMESERVER ────────────────────────────────────────────────────
  synapse:
    image: matrixdotorg/synapse:latest
    platform: linux/arm64
    container_name: synapse
    restart: unless-stopped
    volumes:
      - ./config/homeserver.yaml:/data/homeserver.yaml:ro
      - ./config/chat.local.signing.key:/data/chat.local.signing.key:ro
      - synapse_data:/data
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matrix_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/_matrix/client/versions || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── POSTGRESQL DATABASE ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    platform: linux/arm64
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_secret        # Change in production
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matrix_net
    # Postgres is NOT exposed on host ports — internal Docker network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NGINX REVERSE PROXY ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    platform: linux/arm64
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"    # HTTP → redirect to HTTPS
      - "443:443"  # HTTPS (TLS 1.3)
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/matrix:ro          # TLS certificates
    depends_on:
      - synapse
      - element
    networks:
      - matrix_net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── ELEMENT WEB (CLIENT) ──────────────────────────────────────────────────
  element:
    image: vectorim/element-web:latest
    platform: linux/arm64
    container_name: element
    restart: unless-stopped
    volumes:
      - ./config/element-config.json:/app/config.json:ro
    networks:
      - matrix_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ | grep -q 'Element' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── VOLUMES ──────────────────────────────────────────────────────────────────
volumes:
  synapse_data:
    driver: local
  postgres_data:
    driver: local

# ── NETWORKS ─────────────────────────────────────────────────────────────────
networks:
  matrix_net:
    driver: bridge
    # Private internal network — no services expose direct host ports
    # except Nginx (80/443). Synapse, Postgres, Element unreachable externally.
    ipam:
      config:
        - subnet: 172.20.0.0/24
