##############################################################################
# Synapse Homeserver Configuration
# KPU INFO 4190 — Group 7 — E2EE Messaging Platform
#
# This is a TEMPLATE. Synapse will merge this with generated defaults.
# Run `docker compose run --rm synapse generate` to generate the signing key
# and a base config, then overlay this file.
#
# SECURITY NOTES:
#   - Change macaroon_secret_key and form_secret before any real deployment
#   - Change POSTGRES_PASSWORD in docker-compose.yml
#   - Replace self-signed TLS cert with Let's Encrypt for production
##############################################################################

# ── IDENTITY ────────────────────────────────────────────────────────────────
server_name: "chat.local"
public_baseurl: "https://chat.local/"

pid_file: /data/homeserver.pid

# ── LISTENERS ───────────────────────────────────────────────────────────────
# Synapse listens on 8008 (plain HTTP) inside Docker.
# TLS termination is handled by Nginx externally.
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true        # Trust X-Forwarded-For from Nginx
    bind_addresses: ["::"]   # IPv4 + IPv6
    resources:
      - names: [client]      # Client-Server API (/_matrix/client/*)
        compress: false
      - names: [federation]  # Server-Server API (disabled via whitelist below)
        compress: false

# ── DATABASE ─────────────────────────────────────────────────────────────────
# PostgreSQL backend (NOT SQLite — SQLite is unsuitable for concurrent access).
# Connection targets the 'postgres' service on the Docker bridge network.
database:
  name: psycopg2
  args:
    user: synapse
    password: synapse_secret   # Must match POSTGRES_PASSWORD in docker-compose.yml
    database: synapse
    host: postgres             # Docker service name resolves via internal DNS
    port: 5432
    cp_min: 5                  # Connection pool minimum
    cp_max: 10                 # Connection pool maximum

# ── LOGGING ──────────────────────────────────────────────────────────────────
log_config: "/data/log.config"

# ── MEDIA STORAGE ────────────────────────────────────────────────────────────
media_store_path: /data/media_store

# Max upload size: 50MB
max_upload_size: 52428800

# ── REGISTRATION ─────────────────────────────────────────────────────────────
# DISABLED — No public self-registration.
# New accounts can only be created via the Admin API or register_new_matrix_user CLI.
# This is a closed private deployment.
enable_registration: false

# Even if registration were enabled, require email verification (extra safety)
registrations_require_3pid:
  - email

# ── AUTHENTICATION ────────────────────────────────────────────────────────────
# bcrypt cost factor. 12 is the recommended minimum for production.
# Higher values are more secure but increase login latency.
bcrypt_rounds: 12

# Login throttling: max 3 attempts per 15 minutes per IP
rc_login:
  address:
    per_second: 0.003
    burst_count: 3
  account:
    per_second: 0.003
    burst_count: 3
  failed_attempts:
    per_second: 0.003
    burst_count: 3

# ── FEDERATION ────────────────────────────────────────────────────────────────
# DISABLED — This is a closed private deployment.
# No external Matrix servers can federate with this instance.
# Provides maximum data sovereignty for institutional/private use.
federation_domain_whitelist: []

# ── E2EE SETTINGS ────────────────────────────────────────────────────────────
# Force E2EE on all new rooms by default
encryption_enabled_by_default_for_room_type: all

# Allow users to back up their Olm/Megolm keys to the server
# (Keys are encrypted client-side with the user's recovery passphrase —
#  the server stores only encrypted key blobs, never plaintext keys)
e2e_key_server_max_backup_space: 104857600  # 100MB per user

# ── ROOM SETTINGS ────────────────────────────────────────────────────────────
# Use the latest stable Matrix room version
default_room_version: "10"

# Enforce history visibility: joined members only (no message leakage)
default_room_historyvisibility: joined

# ── SECRETS ──────────────────────────────────────────────────────────────────
# IMPORTANT: Replace these with strong random values before deployment.
# Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
macaroon_secret_key: "REPLACE_WITH_RANDOM_SECRET_64_CHARS_MINIMUM"
form_secret: "REPLACE_WITH_DIFFERENT_RANDOM_SECRET_64_CHARS_MINIMUM"

# ── SIGNING KEY ───────────────────────────────────────────────────────────────
# Generated by `docker compose run --rm synapse generate`
# The .signing.key file is gitignored — never commit it.
signing_key_path: "/data/chat.local.signing.key"

# ── TRUSTED KEY SERVERS ───────────────────────────────────────────────────────
# Used for cross-signing device verification.
# matrix.org is the canonical default; acceptable for private deployments.
trusted_key_servers:
  - server_name: "matrix.org"

# ── TELEMETRY ─────────────────────────────────────────────────────────────────
report_stats: false

# ── RATE LIMITING ─────────────────────────────────────────────────────────────
rc_message:
  per_second: 0.2
  burst_count: 10

rc_api:
  per_second: 0.5
  burst_count: 5

# ── ADMIN SETTINGS ───────────────────────────────────────────────────────────
# The Admin API (/_synapse/admin/*) is blocked at the Nginx level for
# external access. It remains accessible inside the Docker network via:
#   docker compose exec synapse <command>
