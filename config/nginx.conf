##############################################################################
# Nginx Reverse Proxy Configuration
# KPU INFO 4190 — Group 7 — E2EE Messaging Platform
#
# Responsibilities:
#   1. Terminate TLS 1.3 on port 443
#   2. Redirect all HTTP (port 80) → HTTPS (port 443)
#   3. Route /_matrix/* and /_synapse/client/* → Synapse homeserver
#   4. Block /_synapse/admin/* from all external access (403)
#   5. Serve Element Web SPA for all other paths
#   6. Apply rate limiting headers
##############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── LOGGING FORMAT ─────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ── PERFORMANCE ─────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── CLIENT BODY SIZE ────────────────────────────────────────────────────
    # Must match max_upload_size in homeserver.yaml (50MB + overhead)
    client_max_body_size 55M;

    # ── RATE LIMITING ───────────────────────────────────────────────────────
    # Protect login endpoint from brute force
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # General API rate limit
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ── UPSTREAM DEFINITIONS ────────────────────────────────────────────────
    # Docker internal DNS resolves service names on the matrix_net bridge
    upstream synapse {
        server synapse:8008;
        keepalive 32;
    }

    upstream element {
        server element:80;
        keepalive 16;
    }

    # ── HTTP → HTTPS REDIRECT ───────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name chat.local;

        # ACME challenge for Let's Encrypt (if upgrading from self-signed)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── MAIN HTTPS SERVER ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name chat.local;

        # ── TLS CONFIGURATION ──────────────────────────────────────────────
        # TLS 1.3 only — discard all older protocol versions
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;

        # TLS 1.3 ciphersuites (cannot be configured separately in TLS 1.3)
        # These are the only ones used: AES-256-GCM, ChaCha20-Poly1305, AES-128-GCM

        ssl_certificate     /etc/ssl/matrix/cert.pem;
        ssl_certificate_key /etc/ssl/matrix/key.pem;

        # Session resumption
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (enable when using a real CA certificate)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ── SECURITY HEADERS ───────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://chat.local; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── ADMIN API — BLOCK COMPLETELY ───────────────────────────────────
        # The Synapse Admin API MUST NOT be accessible externally.
        # Any access attempt returns 403 Forbidden with no information leakage.
        location /_synapse/admin/ {
            deny all;
            return 403;
        }

        # ── MATRIX CLIENT API ──────────────────────────────────────────────
        # Proxy all Matrix Client-Server API requests to Synapse
        location /_matrix/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for /sync long-polling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Generous timeouts for /sync (clients hold connection open)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 10s;

            proxy_buffering off;
        }

        # ── SYNAPSE CLIENT ENDPOINTS (non-admin) ───────────────────────────
        location /_synapse/client/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── LOGIN RATE LIMITING ────────────────────────────────────────────
        # Apply strict rate limit specifically to login endpoint
        location /_matrix/client/v3/login {
            limit_req zone=login burst=5;

            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── MATRIX FEDERATION (disabled — closed deployment) ──────────────
        # No federation routes needed. Block any attempt to reach federation API.
        location /_matrix/federation/ {
            deny all;
            return 403;
        }

        # ── WELL-KNOWN (Matrix server discovery) ──────────────────────────
        location /.well-known/matrix/ {
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── ELEMENT WEB SPA ───────────────────────────────────────────────
        # All other requests → Element Web React SPA
        location / {
            proxy_pass http://element;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets aggressively
            proxy_cache_valid 200 1d;
        }
    }
}
