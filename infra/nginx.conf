# Purpose: Reverse proxy configuration for Matrix client/admin APIs with TLS-friendly headers (FR-INFRA-02, NFR-SEC-02)

events {}

http {
  upstream synapse_upstream {
    server synapse:8008;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://synapse_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-XSS-Protection "1; mode=block" always;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    # Replace with real certificate files for production TLS termination.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
      proxy_pass http://synapse_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
  }
}
